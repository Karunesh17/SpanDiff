[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spandiff"
version = "0.1.0.dev0"
description = "Compare API request behavior across code revisions using trace evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "sqlglot>=27.0,<28"]

[project.scripts]
spandiff = "spandiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
